<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>alex.tr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <span class="wordmark">alex.tr</span>
    <div class="nav-right">
      <a href="mailto:hello@alex.tr" class="nav-link" aria-label="Email">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        hello@alex.tr
      </a>
      <a href="https://github.com/saberdotmd" target="_blank" class="nav-link" aria-label="GitHub">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
        saberdotmd
      </a>
      <button id="theme-toggle" aria-label="Toggle theme">
        <span id="theme-icon">☀️</span>
      </button>
    </div>
  </nav>

  <main>
    <section class="hero">
      <h1>SERVER-ONE</h1>
      <p class="tagline">Athlone, Ireland</p>
    </section>

    <section class="stats-row">
      <div class="stat-card">
        <div class="stat-label">LOCAL TIME</div>
        <div class="stat-value mono" id="clock">--:--:--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">WEATHER · ATHLONE</div>
        <div class="stat-value mono" id="weather">Loading...</div>
      </div>
      <div class="stat-card player-card">
        <div class="stat-label">NOW PLAYING</div>
        <div class="player-body">
          <img src="cover.jpg" alt="cover" class="player-cover" />
          <div class="player-info">
            <div class="player-title">Neil Vana</div>
            <div class="player-artist">Ludvig Forssell</div>
          </div>
          <button class="player-btn" id="play-btn" aria-label="Play/Pause">
            <svg id="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
        </div>
        <audio id="audio" src="song.mp3" loop></audio>
      </div>
    </section>

    <section class="services">
      <h2>Services</h2>
      <div class="grid">
        <a class="card" href="https://proxmox.alex.tr" target="_blank">
          <span class="card-icon">🖥️</span>
          <div class="card-name">Proxmox</div>
          <div class="card-sub">proxmox.alex.tr</div>
        </a>
        <a class="card" href="https://jellyfin.alex.tr" target="_blank">
          <span class="card-icon">🎬</span>
          <div class="card-name">Jellyfin</div>
          <div class="card-sub">jellyfin.alex.tr</div>
        </a>
        <a class="card" href="https://immich.alex.tr" target="_blank">
          <span class="card-icon">🖼️</span>
          <div class="card-name">Immich</div>
          <div class="card-sub">immich.alex.tr</div>
        </a>
        <a class="card" href="https://music.alex.tr" target="_blank">
          <span class="card-icon">🎵</span>
          <div class="card-name">Navidrome</div>
          <div class="card-sub">music.alex.tr</div>
        </a>
        <a class="card" href="https://komga.alex.tr" target="_blank">
          <span class="card-icon">📚</span>
          <div class="card-name">Komga</div>
          <div class="card-sub">komga.alex.tr</div>
        </a>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
